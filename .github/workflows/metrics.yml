# Gera github-metrics.svg com lowlighter/metrics e depois atualiza o README.
# Requer o secret METRICS_TOKEN (PAT clássico sem escopos basta para dados públicos).
# Sem o secret, o job de métricas é PULADO (não falha) e o README não mostra a imagem.
# Para desativar: Actions > Metrics > "Disable workflow".
name: Metrics

on:
  schedule: [{ cron: "0 6 * * *" }] # diário, 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has-token: ${{ steps.token.outputs.has-token }}
    steps:
      - id: token
        env:
          HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
        run: echo "has-token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

  github-metrics:
    needs: check
    if: needs.check.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "chore(metrics): update github-metrics.svg"
          config_timezone: America/Sao_Paulo
          config_display: large
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_limit: 6

  readme:
    # Mostra (ou esconde) a imagem no README conforme o SVG existir.
    needs: github-metrics
    if: always() && needs.github-metrics.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/sync_pinned.py README.md
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs(readme): update automatic sections"
          git push
