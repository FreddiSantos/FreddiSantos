# Gera github-metrics.svg com lowlighter/metrics.
# Requer o secret METRICS_TOKEN (PAT clássico sem escopos basta para dados públicos).
# Para desativar: Actions > Metrics > "Disable workflow".
name: Metrics

on:
  schedule: [{ cron: "0 6 * * *" }] # diário, 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "chore(metrics): update github-metrics.svg"
          config_timezone: America/Sao_Paulo
          config_display: large
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_limit: 6
